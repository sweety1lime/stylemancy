# Бесплатный проект Supabase засыпает после недели без запросов (например, на каникулах).
# Раз в день делаем один лёгкий запрос к базе, чтобы этого не случилось.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Запрос к базе
        run: |
          curl --fail --silent --show-error \
            -X POST 'https://kecshdgmqumjetoawcja.supabase.co/rest/v1/rpc/class_name_by_code' \
            -H 'apikey: sb_publishable_NeKLjmmY5_EqX2u8mpQw8w_hPzqL33k' \
            -H 'Content-Type: application/json' \
            -d '{"class_code":"AAAAAA"}'
